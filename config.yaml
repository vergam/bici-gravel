# ---------------------------------------------------------------
# Requisits de la bici (edita-ho a gust)
# ---------------------------------------------------------------
filters:
  max_price: 1500        # preu màxim en €
  min_price: 600         # per descartar components i accessoris
  size: "L"              # 1,88 m -> L (Megamo: 180-190 cm). Posa "" per desactivar

  # El nom o la URL ha de contenir ALMENYS una d'aquestes paraules
  # (grup GRX/Apex o models de gravel que ja conec i compleixen)
  include_any:
    - grx
    - apex
    - xplr
    - ekar
    - jakar
    - silex
    - grizl
    - grail
    - revolt
    - topstone
    - nuroad
    - kalima
    - nirone allroad
    - impulso
    - arcadex
    - jaroon
    - adlar
    - terra
    - diverge
    - crux
    - backroad
    - crosshill
    - gravelx
    - aspero
    - silk
    - megamo west
    - dark matter

  # Si hi surt alguna d'aquestes paraules, es descarta
  exclude:
    - claris
    - sora
    - tourney
    - altus
    - acera
    - flat-bar
    - flat bar
    - junior
    - kids
    - infantil
    - ebike
    - e-bike
    - electric
    - eléctric
    - hybrid
    - urban
    - frameset
    - cuadro
    - quadre
    - marco
    - jakar 20
    - jakar base
    - grizl 5
    - x-strada
    - segunda mano repuesto
    - rueda
    - ruedas

# Bonus per ordenar les ofertes (més punts = surt més amunt).
# A sobre es suma el 50% del descompte i es resta preu/100.
bonus:
  carbon: 15
  carbono: 15
  rx6: 6
  rx8: 8
  "1x12": 5
  "2x12": 5
  tubeless: 3

respect_robots: true      # el bot no llegeix pàgines que el robots.txt de la web prohibeix

telegram:
  max_items: 8            # ofertes per missatge
  only_changes: false     # true = només avisa si hi ha novetats o baixades de preu
  notify_when_empty: true # envia missatge curt encara que no hi hagi res
  price_drop_pct: 5       # marca com a baixada si el preu cau almenys aquest %

# ---------------------------------------------------------------
# Botigues, outlets i segona mà.
#
#  pages / page_url : paginació ({n} = 2,3,4... o {from}/{size})
#  render           : auto (per defecte: HTTP i, si falla o surt buit, navegador),
#                     true (sempre navegador, per a pàgines que carreguen amb JS),
#                     false (mai navegador)
#  load_more        : text del botó "Veure més" que cal prémer (només amb navegador)
#  optional: true   : font que no he pogut verificar des d'aquí. S'intenta cada dia,
#                     però si falla NO surt al missatge diari (només a /diagnosi).
#
# Les fonts sense "optional" són les que sí que he vist funcionar.
# ---------------------------------------------------------------
